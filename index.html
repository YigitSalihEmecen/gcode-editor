<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Code Editor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230f0f0f' rx='20'/%3E%3Ctext x='50' y='75' font-family='monospace' font-size='80' font-weight='bold' fill='%23ff6600' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
    <!-- Import JetBrains Mono for the Monotype aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo-container">
            <div class="logo"><span style="color: var(--accent-color);">G-CODE</span> <span style="color: #fff;">EDITOR</span></div>
            <div class="author-text">by yigit</div>
        </div>
        <div class="nav-actions">
            <a href="https://github.com/YigitSalihEmecen" target="_blank" class="github-link">GitHub</a>
            <button id="exportBtn" class="btn outline" disabled>EXPORT G-CODE</button>
        </div>
    </header>
    
    <main class="container">
        <aside class="sidebar">
            <div class="control-group">
                <label for="fileInput" class="btn primary full-width">UPLOAD G-CODE</label>
                <input type="file" id="fileInput" accept=".gcode,.txt,.nc" style="display: none;">
                <div id="fileNameDisplay" class="file-name">No file selected</div>
            </div>

            <hr class="separator">

            <div class="control-group">
                <h3>TRANSFORM</h3>
                
                <div class="input-row">
                    <label for="uniformScaleCheckbox">UNIFORM SCALE</label>
                    <input type="checkbox" id="uniformScaleCheckbox" checked>
                </div>

                <div class="input-row" id="scaleRow">
                    <label for="scaleInput">SCALE</label>
                    <input type="number" id="scaleInput" value="1.0" step="0.1">
                </div>

                <div class="input-row hidden" id="scaleXRow">
                    <label for="scaleXInput">SCALE X</label>
                    <input type="number" id="scaleXInput" value="1.0" step="0.1">
                </div>
                
                <div class="input-row hidden" id="scaleYRow">
                    <label for="scaleYInput">SCALE Y</label>
                    <input type="number" id="scaleYInput" value="1.0" step="0.1">
                </div>
                
                <div class="input-row hidden" id="scaleZRow">
                    <label for="scaleZInput">SCALE Z</label>
                    <input type="number" id="scaleZInput" value="1.0" step="0.1">
                </div>

                <div class="input-row">
                    <label for="offsetXInput">OFFSET X</label>
                    <input type="number" id="offsetXInput" value="0" step="1">
                </div>

                <div class="input-row">
                    <label for="offsetYInput">OFFSET Y</label>
                    <input type="number" id="offsetYInput" value="0" step="1">
                </div>

                <button id="applyBtn" class="btn primary full-width" disabled>APPLY SETTINGS</button>
            </div>
            
            <div class="info-panel">
                <p><strong>LINES:</strong> <span id="lineCount">0</span></p>
                <p><strong>BOUNDS:</strong> <br><span id="boundsDisplay">N/A</span></p>
            </div>
        </aside>
        
        <section class="preview-area">
            <div class="canvas-container">
                <canvas id="gcodeCanvas"></canvas>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
